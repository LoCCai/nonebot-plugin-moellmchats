name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest pytest-asyncio ruff build
      - if: matrix.python-version == '3.12'
        run: python -m pip install nonebot2==2.4.4 nonebot-adapter-onebot==2.4.6
      - run: ruff check nonebot_plugin_moellmchats tests
      - run: pytest -q
      - if: matrix.python-version == '3.12'
        run: python -m build
