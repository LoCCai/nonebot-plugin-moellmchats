name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .
          ruff==0.16.2
          pyright==1.1.411
      - run: ruff check nonebot_plugin_moellmchats tests scripts
      - name: Check formatting of the protocol gate
        run: >-
          ruff format --check
          nonebot_plugin_moellmchats/builtin_tools.py
          nonebot_plugin_moellmchats/event_simulator.py
          nonebot_plugin_moellmchats/onebot_facade.py
          nonebot_plugin_moellmchats/protocol_broker.py
          nonebot_plugin_moellmchats/protocol_context.py
          nonebot_plugin_moellmchats/protocol_registry.py
          nonebot_plugin_moellmchats/tool_contracts.py
          scripts
          tests/test_onebot_facade.py
          tests/test_protocol_broker.py
          tests/test_protocol_context.py
          tests/test_protocol_registry.py
      - name: Check protocol type boundaries
        run: >-
          pyright
          --pythonpath "$(command -v python)"
          nonebot_plugin_moellmchats/builtin_tools.py
          nonebot_plugin_moellmchats/event_simulator.py
          nonebot_plugin_moellmchats/onebot_facade.py
          nonebot_plugin_moellmchats/protocol_broker.py
          nonebot_plugin_moellmchats/protocol_context.py
          nonebot_plugin_moellmchats/protocol_registry.py
          nonebot_plugin_moellmchats/tool_contracts.py
          scripts/generate_protocol_manifests.py
          scripts/check_repository.py
          scripts/check_distribution.py
      - run: python scripts/check_repository.py
      - run: python -m pip check

  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest pytest-asyncio ruff==0.16.2 "fakeredis>=2.31.0,<3.0.0"
      - if: matrix.python-version == '3.12'
        run: python -m pip install nonebot2==2.4.4 nonebot-adapter-onebot==2.4.6
      - run: ruff check nonebot_plugin_moellmchats tests
      - run: pytest -q --ignore=tests/test_sandbox_integration.py

  sandbox:
    name: Mandatory root sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest pytest-asyncio
      - name: Run mandatory root sandbox probes and reject skipped tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          JUNIT_REPORT="$RUNNER_TEMP/sandbox-junit.xml"
          test -x "$PYTHON_BIN"
          test "$(sudo -n id -u)" = "0"
          sudo -n "$PYTHON_BIN" -m pytest -q \
            tests/test_sandbox_integration.py \
            --strict-config \
            --strict-markers \
            --junitxml="$JUNIT_REPORT"
          "$PYTHON_BIN" - "$JUNIT_REPORT" <<'PY'
          from pathlib import Path
          import sys
          from xml.etree import ElementTree

          report = Path(sys.argv[1])
          root = ElementTree.parse(report).getroot()
          suites = [root] if root.tag.endswith("testsuite") else root.findall(".//testsuite")
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if tests <= 0:
              raise SystemExit("mandatory sandbox suite did not execute any tests")
          if skipped:
              raise SystemExit(f"mandatory sandbox suite skipped {skipped} test(s)")
          print(f"SANDBOX_JUNIT_OK tests={tests} skipped={skipped}")
          PY

  build:
    name: Build distributions once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Build and describe the release candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m build --sdist --wheel --outdir dist/ .
          python -m twine check dist/*.whl dist/*.tar.gz
          python scripts/check_distribution.py dist/*.whl dist/*.tar.gz
          mapfile -t WHEELS < <(find dist -maxdepth 1 -type f -name '*.whl' -print | sort)
          mapfile -t SDISTS < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print | sort)
          test "${#WHEELS[@]}" -eq 1
          test "${#SDISTS[@]}" -eq 1
          export WHEEL_PATH="${WHEELS[0]}"
          python - <<'PY'
          from email.parser import Parser
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheel = Path(os.environ["WHEEL_PATH"])
          with ZipFile(wheel) as archive:
              metadata_members = [
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_members) != 1:
                  raise SystemExit(f"expected one wheel METADATA file, got {metadata_members!r}")
              metadata = Parser().parsestr(archive.read(metadata_members[0]).decode("utf-8"))
          payload = {
              "distribution": metadata.get("Name"),
              "version": metadata.get("Version"),
              "requires_python": metadata.get("Requires-Python"),
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["GITHUB_SHA"],
              "ci_run_id": os.environ["GITHUB_RUN_ID"],
          }
          if not all(payload.values()):
              raise SystemExit(f"incomplete build metadata: {payload!r}")
          Path("dist/BUILD-METADATA.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd dist
            sha256sum -- *.whl *.tar.gz | sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonebot-plugin-moellmchats-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  package:
    name: ${{ matrix.artifact-kind }} smoke on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        artifact-kind: [wheel, sdist]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nonebot-plugin-moellmchats-dist
          path: dist/
      - name: Install and load the verified distribution outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c SHA256SUMS
          )
          case "${{ matrix.artifact-kind }}" in
            wheel) PACKAGE_PATTERN='*.whl' ;;
            sdist) PACKAGE_PATTERN='*.tar.gz' ;;
            *) exit 2 ;;
          esac
          mapfile -t PACKAGES < <(find dist -maxdepth 1 -type f -name "$PACKAGE_PATTERN" -print | sort)
          test "${#PACKAGES[@]}" -eq 1
          PACKAGE_PATH="$(realpath "${PACKAGES[0]}")"
          BUILD_METADATA="$(realpath dist/BUILD-METADATA.json)"
          SMOKE_VENV="$RUNNER_TEMP/package-venv-${{ matrix.python-version }}-${{ matrix.artifact-kind }}"
          SMOKE_CWD="$RUNNER_TEMP/package-cwd-${{ matrix.python-version }}-${{ matrix.artifact-kind }}"
          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          "$SMOKE_VENV/bin/python" -m pip install "$PACKAGE_PATH"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            "$SMOKE_VENV/bin/python" -m pip install \
              nonebot2==2.4.4 \
              nonebot-adapter-onebot==2.4.6
          fi
          mkdir -p "$SMOKE_CWD"
          cd "$SMOKE_CWD"
          export BUILD_METADATA
          export DRIVER='~none'
          export LOCALSTORE_USE_CWD=true
          export NICKNAME='["TestBot"]'
          export SOURCE_ROOT="$GITHUB_WORKSPACE"
          export SUPERUSERS='["1"]'
          env -u PYTHONPATH "$SMOKE_VENV/bin/python" - <<'PY'
          import asyncio
          from importlib.metadata import metadata
          import json
          import os
          from pathlib import Path

          import nonebot

          expected = json.loads(Path(os.environ["BUILD_METADATA"]).read_text(encoding="utf-8"))
          assert expected["source_repository"] == os.environ["GITHUB_REPOSITORY"]
          assert expected["source_sha"] == os.environ["GITHUB_SHA"]
          assert expected["ci_run_id"] == os.environ["GITHUB_RUN_ID"]

          nonebot.init()
          assert nonebot.load_plugin("nonebot_plugin_localstore") is not None
          assert nonebot.load_plugin("nonebot_plugin_moellmchats") is not None

          import nonebot_plugin_moellmchats as package
          from nonebot_plugin_moellmchats.runtime_reload import runtime_reloader
          from nonebot_plugin_moellmchats.runtime_snapshot import runtime_snapshots
          from nonebot_plugin_moellmchats.onebot_facade import make_text_message
          from nonebot_plugin_moellmchats.protocol_registry import protocol_registry

          source_root = Path(os.environ["SOURCE_ROOT"]).resolve()
          module_path = Path(package.__file__).resolve()
          assert source_root not in module_path.parents, module_path
          package_metadata = metadata("nonebot-plugin-moellmchats")
          assert package_metadata["Name"] == expected["distribution"]
          assert package_metadata["Version"] == expected["version"]
          assert package_metadata["Requires-Python"] == expected["requires_python"]
          assert str(make_text_message("onebot_v11", "v11 package smoke")) == "v11 package smoke"
          assert str(make_text_message("onebot_v12", "v12 package smoke")) == "v12 package smoke"
          assert len(protocol_registry.standard_v11_actions) == 38
          assert len(protocol_registry.v12_actions) == 31
          assert len(protocol_registry.napcat_actions) == 175

          result = asyncio.run(runtime_reloader.reload("package-smoke"))
          snapshot = runtime_snapshots.current()
          assert result.generation == 1
          assert snapshot is not None and snapshot.generation == 1
          print(f"PACKAGE_SMOKE_OK {module_path} generation={result.generation}")
          PY

  release-gate:
    name: release-gate
    if: ${{ always() }}
    needs: [quality, test, sandbox, build, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SANDBOX_RESULT: ${{ needs.sandbox.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$SANDBOX_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$QUALITY_RESULT" = success
          echo "RELEASE_GATE_OK"
